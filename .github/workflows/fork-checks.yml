name: Fork Checks

# Go build / vet / test for THIS fork, without touching contribution branches.
#
#   - push to `integration`  -> checks the stacked code (all merged subjects)
#   - manual dispatch (`ref`) -> check any single branch in isolation, e.g. to
#                                gate a subject before opening its upstream PR.
#
# Like the build workflow, this lives ONLY on `integration` so that fix/* and
# feat/* branches stay pristine for zero-conflict PRs.

on:
  push:
    branches:
      - integration
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to check (e.g. fix/auth-context)'
        required: true
        default: integration
        type: string
      test_path:
        description: 'Go package path passed to `go test`'
        required: false
        default: './internal/...'
        type: string

permissions:
  contents: read

jobs:
  go:
    name: Go build / vet / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      # Upstream go.mod is not fully tidy against a whole-module `./...` build
      # (the Docker image only compiles one target). Allow the module graph to
      # be resolved on the fly so checks don't fail on pre-existing tidiness.
      GOFLAGS: -mod=mod
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Scope to library code (./internal, ./pkg). The cmd/* main packages use
      # //go:embed dist and need the frontend built first, which is out of scope
      # for a Go check; the Docker image build already validates the full binary.
      #
      # Some upstream packages are dead code: not wired into any binary and, in
      # the case of `notifications`, not even compiling. Exclude them so checks
      # reflect the code that actually ships. Extend DEAD_PKGS if we ever adopt
      # one of these as a subject.
      - name: Resolve package list
        id: pkgs
        run: |
          DEAD_PKGS='/internal/(notifications|lsp)$'
          PKGS="$(go list -e ./internal/... ./pkg/... | grep -vE "$DEAD_PKGS" | tr '\n' ' ')"
          echo "list=$PKGS" >> "$GITHUB_OUTPUT"
          echo "Checking packages:"; echo "$PKGS" | tr ' ' '\n'

      - name: Build
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: Vet
        run: go vet ${{ steps.pkgs.outputs.list }}

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ${{ github.event.inputs.test_path || steps.pkgs.outputs.list }}
