name: Fork Integration Build

# Builds and pushes Dockman images to GHCR for THIS fork (not upstream).
#
#   - push to `integration`  -> image tag `integration`
#                               = the stacked image containing every merged subject,
#                                 for end-to-end testing on the homelab.
#   - manual dispatch (`ref`) -> build any single branch in isolation,
#                               tag = sanitized branch name (or custom `tag`).
#
# This workflow lives ONLY on the `integration` branch, on purpose:
# contribution branches (fix/*, feat/*) stay clean so their PRs to the
# upstream repo never carry any of our CI files. Zero-conflict by design.

on:
  push:
    branches:
      - integration
    paths:
      - 'core/**'
      - 'ui/**'
      - 'pkg/docker/**'
      - '.dockerignore'
      - '.github/workflows/fork-integration-build.yml'
      - 'scripts/ghcr-retention.py'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch or ref to build (defaults to the workflow ref)'
        required: false
        type: string
      tag:
        description: 'Optional image tag override (defaults to sanitized ref)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      tag: ${{ steps.p.outputs.tag }}
      history_tag: ${{ steps.p.outputs.history_tag }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
          fetch-depth: 1

      - id: p
        env:
          REQUESTED_REF: ${{ github.event.inputs.ref || github.ref_name }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.event.inputs.ref || github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          REF="$REQUESTED_REF"
          RAW="$REQUESTED_TAG"
          TAG="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | sed 's/[^a-z0-9._-]/-/g')"
          COMMIT="$(git rev-parse HEAD)"
          HISTORY_TAG=""
          if [[ "$TAG" == "integration" ]]; then
            HISTORY_TAG="integration-${COMMIT:0:12}"
          fi
          IMAGE="$(echo "ghcr.io/${REPOSITORY_OWNER}/dockman" | tr '[:upper:]' '[:lower:]')"
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "history_tag=$HISTORY_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building ref='$REF' -> '$IMAGE:$TAG' history='$HISTORY_TAG'"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            machine: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            machine: ubuntu-24.04-arm
            arch: arm64
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.machine }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve source metadata
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: pkg/docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            ${{ needs.prepare.outputs.history_tag != '' && format('{0}:{1}-{2}', needs.prepare.outputs.image, needs.prepare.outputs.history_tag, matrix.arch) || '' }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            type=registry,ref=${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT_INFO=${{ steps.source.outputs.commit }}
            BUILD_DATE=${{ steps.source.outputs.build_date }}
            BRANCH=${{ needs.prepare.outputs.ref }}

      - name: Report all vulnerabilities (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          version: v0.72.0
          format: json
          output: trivy-${{ matrix.arch }}.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          scanners: vuln
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}

      - name: Upload vulnerability report (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Gate fixable high and critical vulnerabilities (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          version: v0.72.0
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          scanners: vuln
          trivyignores: .trivyignore.yaml
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}

  # Dockman's own Compose calls against the Compose, Buildx and Docker CLI this
  # image ships, on a real daemon (core/internal/docker/compose/contract_test.go).
  # The multi-arch tag is only published once it passes.
  contract:
    name: Compose contract (amd64, ${{ matrix.store }} image store)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Docker 29 installs default to the containerd image store, where
        # Compose records image digests differently from the classic store.
        store: [classic, containerd]
    steps:
      - name: Switch the daemon to the containerd image store
        if: matrix.store == 'containerd'
        run: |
          sudo python3 - <<'PY'
          import json, os
          path = "/etc/docker/daemon.json"
          conf = json.load(open(path)) if os.path.exists(path) else {}
          conf.setdefault("features", {})["containerd-snapshotter"] = True
          json.dump(conf, open(path, "w"), indent=2)
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | tee /dev/stderr | grep -q io.containerd.snapshotter

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build the contract suite
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go test -c -tags composecontract -o "$RUNNER_TEMP/contract.test" ./internal/docker/compose

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run it inside the image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
        run: |
          docker pull -q "$IMAGE"
          COMPOSE_VERSION="$(docker inspect -f '{{index .Config.Labels "dev.dockman.build.compose"}}' "$IMAGE")"
          # Same path inside and outside: the daemon resolves what Compose
          # hands it on the host.
          WORK="$RUNNER_TEMP/contract-work"
          mkdir -p "$WORK"
          # The Compose of the image currently published as `integration`:
          # stacks it deployed must not be recreated by this one.
          PREVIOUS=()
          if docker pull -q "${{ needs.prepare.outputs.image }}:integration" >/dev/null 2>&1; then
            docker create --name contract-previous "${{ needs.prepare.outputs.image }}:integration" >/dev/null
            docker cp contract-previous:/usr/local/bin/docker-compose "$RUNNER_TEMP/previous-compose"
            docker rm contract-previous >/dev/null
            PREVIOUS=(-v "$RUNNER_TEMP/previous-compose:/previous-compose:ro" -e CONTRACT_PREVIOUS_COMPOSE=/previous-compose)
          fi
          set +e
          docker run --rm --entrypoint /contract.test \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/contract.test:/contract.test:ro" \
            -v "$WORK:$WORK" -w "$WORK" \
            -e CONTRACT_WORKDIR="$WORK" \
            -e CONTRACT_COMPOSE_VERSION="$COMPOSE_VERSION" \
            "${PREVIOUS[@]}" \
            "$IMAGE" -test.run '^TestContract' -test.v -test.timeout 30m 2>&1 | tee "$RUNNER_TEMP/contract.log"
          status=${PIPESTATUS[0]}
          {
            echo "### Compose contract ($COMPOSE_VERSION, ${{ matrix.store }} image store)"
            grep -E -- '^(--- |ok|FAIL|PASS)' "$RUNNER_TEMP/contract.log" | sed 's/^/    /'
            echo
            grep -h 'OBSERVE:' "$RUNNER_TEMP/contract.log" | sed -E 's/^.*OBSERVE: /- /'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The entrypoint, which nothing else exercises: the contract suite replaces
  # it to run its own binary. A read-only root filesystem is the hardening
  # switch of NAS appliances, and it used to stop the container at `addgroup`.
  boot:
    name: Boot (amd64, ${{ matrix.rootfs }} rootfs)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # read-only-root is the combination the documentation used to
        # recommend, and it skips most of the entrypoint.
        rootfs: [writable, read-only, read-only-root]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start it and deploy a stack that builds
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-amd64
          ROOTFS: ${{ matrix.rootfs }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"
          WORK="$RUNNER_TEMP/boot-$ROOTFS"
          mkdir -p "$WORK/compose/app" "$WORK/config"
          cat > "$WORK/compose/app/Dockerfile" <<'DF'
          FROM busybox:1.37
          RUN echo DMC-BOOT-BUILD
          DF
          printf 'services:\n  app:\n    build: .\n    command: ["sleep", "3600"]\n' > "$WORK/compose/app/compose.yaml"
          chmod -R a+rwX "$WORK"

          READ_ONLY=()
          PUID=1000
          PGID=1000
          case "$ROOTFS" in
            read-only) READ_ONLY=(--read-only) ;;
            read-only-root) READ_ONLY=(--read-only); PUID=0; PGID=0 ;;
          esac
          # No tmpfs on purpose: a read-only deployment must work with the
          # volumes it already has.
          docker run -d --name "boot-$ROOTFS" "${READ_ONLY[@]}" \
            -p 8866:8866 -e PUID=$PUID -e PGID=$PGID \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -v "$WORK/compose:/compose" -v "$WORK/config:/config" \
            -v /var/run/docker.sock:/var/run/docker.sock "$IMAGE" >/dev/null

          API=http://localhost:8866/api/protected
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' $API/ping)" = 200 ]; then
              echo "ready after ${i}s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "boot-$ROOTFS")" != "true" ]; then
              echo "the container stopped:"; docker logs "boot-$ROOTFS"; exit 1
            fi
            sleep 1
          done
          docker logs "boot-$ROOTFS" 2>&1 | head -20

          body='{"filename":"compose/app/compose.yaml"}'
          { printf '\x00'; printf '%08x' ${#body} | xxd -r -p; printf '%s' "$body"; } > req.bin
          curl -sS -m 600 -X POST -H 'Content-Type: application/connect+json' \
            -H 'Connect-Protocol-Version: 1' --data-binary @req.bin -o resp.bin \
            "$API/local/docker.v1.DockerService/ComposeUp"
          python3 - <<'PY'
          import json, re, struct, sys
          data = open('resp.bin', 'rb').read()
          index, failed = 0, None
          while index + 5 <= len(data):
              flag = data[index]
              size = struct.unpack('>I', data[index + 1:index + 5])[0]
              message = json.loads(data[index + 5:index + 5 + size])
              index += 5 + size
              if flag & 2:
                  failed = message.get('error')
                  continue
              for line in re.sub(r'\x1b\[[0-9;?]*[A-Za-z]', '', message.get('message', '')).splitlines():
                  if re.search(r'DMC-BOOT-BUILD|Built|Started|error|Error', line):
                      print('  |', line.strip()[:200])
          if failed:
              print('deploy failed:', json.dumps(failed)[:500]); sys.exit(1)
          PY
          running=$(docker ps -q --filter label=com.docker.compose.project=app | wc -l)
          echo "containers running: $running"
          [ "$running" = "1" ]
          docker logs "boot-$ROOTFS" 2>&1 | grep -E ' ERR | FTL |panic' | head -5 || true
          docker rm -f "boot-$ROOTFS" >/dev/null
          docker compose -f "$WORK/compose/app/compose.yaml" -p app down --rmi local >/dev/null 2>&1 || true

  manifest:
    needs: [prepare, build, contract, boot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        id: image
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          HISTORY_TAG="${{ needs.prepare.outputs.history_tag }}"
          if [[ -n "$HISTORY_TAG" ]]; then
            docker buildx imagetools create -t "$IMAGE:$HISTORY_TAG" \
              "$IMAGE:$HISTORY_TAG-amd64" \
              "$IMAGE:$HISTORY_TAG-arm64"
          fi
          INSPECT="$(docker buildx imagetools inspect "$IMAGE:$TAG")"
          echo "$INSPECT"
          DIGEST="$(awk '$1 == "Digest:" {print $2; exit}' <<< "$INSPECT")"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unable to resolve the multi-arch image digest" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Image \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign multi-arch image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  retention:
    name: Retain three integration builds
    needs: [prepare, manifest]
    if: needs.prepare.outputs.tag == 'integration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout retention policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove unreachable GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ghcr-retention.py \
            --owner "${{ github.repository_owner }}" \
            --package dockman \
            --tag integration \
            --keep 3 \
            --dry-run
          python3 scripts/ghcr-retention.py \
            --owner "${{ github.repository_owner }}" \
            --package dockman \
            --tag integration \
            --keep 3
