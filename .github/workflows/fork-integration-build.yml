name: Fork Integration Build

# Builds and pushes Dockman images to GHCR for THIS fork (not upstream).
#
#   - push to `integration`  -> image tag `integration`
#                               = the stacked image containing every merged subject,
#                                 for end-to-end testing on the homelab.
#   - manual dispatch (`ref`) -> build any single branch in isolation,
#                               tag = sanitized branch name (or custom `tag`).
#
# This workflow lives ONLY on the `integration` branch, on purpose:
# contribution branches (fix/*, feat/*) stay clean so their PRs to the
# upstream repo never carry any of our CI files. Zero-conflict by design.

on:
  push:
    branches:
      - integration
    paths:
      - 'core/**'
      - 'ui/**'
      - 'pkg/docker/**'
      - '.dockerignore'
      - '.github/workflows/fork-integration-build.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build (e.g. fix/auth-context)'
        required: true
        default: integration
        type: string
      tag:
        description: 'Optional image tag override (defaults to sanitized ref)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-build-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      tag: ${{ steps.p.outputs.tag }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - id: p
        run: |
          REF="${{ github.event.inputs.ref || github.ref_name }}"
          RAW="${{ github.event.inputs.tag || github.event.inputs.ref || github.ref_name }}"
          TAG="$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | sed 's/[^a-z0-9._-]/-/g')"
          IMAGE="$(echo "ghcr.io/${{ github.repository_owner }}/dockman" | tr '[:upper:]' '[:lower:]')"
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building ref='$REF' -> '$IMAGE:$TAG'"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            machine: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            machine: ubuntu-24.04-arm
            arch: arm64
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.machine }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout target ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve source metadata
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: pkg/docker/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          platforms: ${{ matrix.platform }}
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            type=registry,ref=${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT_INFO=${{ steps.source.outputs.commit }}
            BUILD_DATE=${{ steps.source.outputs.build_date }}
            BRANCH=${{ needs.prepare.outputs.ref }}

      - name: Scan pushed image (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ needs.prepare.outputs.image }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          docker buildx imagetools create -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
          echo "### Image \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$TAG"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign multi-arch image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: cosign sign --yes "$IMAGE:$TAG"
